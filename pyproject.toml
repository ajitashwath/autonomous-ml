[tool.poetry]
name = "automlops"
version = "0.1.0"
description = "AutoMLOps — Production-grade self-healing ML platform"
authors = ["AutoMLOps Team"]
readme = "README.md"
python = "^3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",  # line length is not enforced
    # Uppercase X / X_train / X_test is the scikit-learn convention for feature matrices.
    "N803",
    "N806",
]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]
# Top-level ./mlflow and ./airflow hold Dockerfiles, which makes ruff mistake these
# packages for first-party code.
known-third-party = ["mlflow", "airflow"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true