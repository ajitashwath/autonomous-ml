apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift-detector
  namespace: automlops
  labels:
    app: drift-detector
    app.kubernetes.io/part-of: automlops
spec:
  schedule: "*/5 * * * *"     
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1      
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app: drift-detector
        spec:
          restartPolicy: OnFailure
          containers:
            - name: drift-detector
              image: automlops/drift-detector:latest
              imagePullPolicy: Always
              command:
                - python
                - -m
                - src.drift_detector.detector
              envFrom:
                - configMapRef:
                    name: automlops-config
                - secretRef:
                    name: automlops-secrets
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "1Gi"
              volumeMounts:
                - name: reference-data
                  mountPath: /app/data/reference
                  readOnly: true
                - name: drift-reports
                  mountPath: /app/data/drift_reports
          volumes:
            - name: reference-data
              persistentVolumeClaim:
                claimName: automlops-data-pvc
                readOnly: true
            - name: drift-reports
              emptyDir: {}