gate:
  auc_delta_threshold: 0.005
  significance_level: 0.05
  require_significance: true

  hard_floors:
    roc_auc: 0.70
    f1: 0.55
    precision: 0.50
  log_to_db: true

evaluation:
  # Labelled data (raw features + target) both models are scored on.
  holdout_path: "data/reference/holdout.parquet"
  target_column: "Churn"

reference:
  data_path: "data/reference/reference.parquet"

promotion:
  from_stage: "Staging"
  to_stage: "Production"
  archive_old_production: true

rollback:
  keep_current_on_failure: true