detection:
  window_size: 1000
  check_interval_seconds: 300
  drift_share_threshold: 0.3
  pvalue_threshold: 0.05

reference:
  data_path: "data/reference/reference.parquet"

evidently:
  reports:
    - "DataDriftPreset"
    - "DataQualityPreset"
    - "ClassificationPreset"
  report_output_dir: "data/drift_reports"

alerting:
  trigger_airflow: true
  log_to_db: true
  # Slack incoming webhook — set to your webhook URL and flip slack_enabled to true.
  # Override at runtime with the SLACK_WEBHOOK_URL environment variable.
  slack_enabled: false
  slack_webhook_url: ""
  critical_features:
    - "MonthlyCharges"
    - "tenure"
    - "Contract"

